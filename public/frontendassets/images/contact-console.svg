<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" role="img" aria-labelledby="title desc">
  <title id="title">Consultation console</title>
  <desc id="desc">A consultation console showing project plan, timeline, and module selection for an MLM platform.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.52" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#fdf2f8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.52" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="shadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="980" height="720" rx="34" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="98" y="82" width="784" height="556" rx="28" fill="#ffffff"/>
    <rect x="98" y="82" width="784" height="82" rx="28" fill="#f8fafc"/>
    <path d="M98 164H882" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="142" y="116" width="240" height="20" rx="10" fill="#0f172a"/>
    <rect x="704" y="110" width="126" height="34" rx="17" fill="url(#accent)"/>
  </g>
  <g>
    <rect x="142" y="208" width="318" height="82" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="174" y="244" fill="#2563eb" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900">Plan Selected</text>
    <text x="174" y="272" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900">Hybrid Binary + Store</text>
    <rect x="520" y="208" width="318" height="82" rx="18" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2"/>
    <text x="552" y="244" fill="#7c3aed" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900">Launch Window</text>
    <text x="552" y="272" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900">8 to 12 weeks</text>
  </g>
  <g>
    <rect x="142" y="326" width="696" height="54" rx="14" fill="#f8fafc"/>
    <circle cx="174" cy="353" r="13" fill="#2563eb"/>
    <rect x="206" y="343" width="190" height="16" rx="8" fill="#0f172a"/>
    <rect x="636" y="343" width="150" height="16" rx="8" fill="#14b8a6"/>
    <rect x="142" y="400" width="696" height="54" rx="14" fill="#f8fafc"/>
    <circle cx="174" cy="427" r="13" fill="#7c3aed"/>
    <rect x="206" y="417" width="242" height="16" rx="8" fill="#0f172a"/>
    <rect x="636" y="417" width="122" height="16" rx="8" fill="#ec4899"/>
    <rect x="142" y="474" width="696" height="54" rx="14" fill="#f8fafc"/>
    <circle cx="174" cy="501" r="13" fill="#14b8a6"/>
    <rect x="206" y="491" width="208" height="16" rx="8" fill="#0f172a"/>
    <rect x="636" y="491" width="166" height="16" rx="8" fill="#2563eb"/>
  </g>
  <g>
    <rect x="142" y="562" width="136" height="20" rx="10" fill="#dbeafe"/>
    <rect x="304" y="562" width="136" height="20" rx="10" fill="#ede9fe"/>
    <rect x="466" y="562" width="136" height="20" rx="10" fill="#fce7f3"/>
    <rect x="628" y="562" width="136" height="20" rx="10" fill="#ccfbf1"/>
  </g>
</svg>
