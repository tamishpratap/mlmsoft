<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" role="img" aria-labelledby="title desc">
  <title id="title">MLM service architecture</title>
  <desc id="desc">A service architecture diagram with compensation, commerce, automation, wallet, and mobile modules.</desc>
  <defs>
